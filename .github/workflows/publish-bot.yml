name: Publish Waldau bot build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-bot.yml"
      - "Program.cs"
      - "Services/**"
      - "Options/**"
      - "WaldauCastle.csproj"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish
      run: dotnet publish WaldauCastle.csproj -c Release -o publish
    - name: Pack
      run: tar -czf waldau-bot.tgz -C publish .
    - name: Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete waldau-bot --yes --repo Befivee/Waldau || true
        gh release create waldau-bot waldau-bot.tgz \
          --repo Befivee/Waldau \
          --target "$GITHUB_SHA" \
          --title "Waldau bot build" \
          --notes "Hostkey: unpack into /var/www/waldau and systemctl restart waldau. Do not overwrite waldau.db." \
          --prerelease
